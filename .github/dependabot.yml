version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      # The AWS SDK crates release together and must move together.
      aws:
        patterns: ["aws-*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: [ci, dependencies]
    ignore:
      # The msrv job pins this to rust-version on purpose; bumping it hides
      # MSRV breakage instead of testing for it.
      - dependency-name: dtolnay/rust-toolchain
