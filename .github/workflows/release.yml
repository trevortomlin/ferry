name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    # The oldest supported runner, so the binary links against an older glibc
    # and runs on more distributions.
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release

      - name: Package
        run: |
          name="ferry-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir "$name"
          cp target/release/ferry LICENSE README.md CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^(## )?\[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "Ferry $GITHUB_REF_NAME"
          --notes-file notes.md
          --verify-tag
          "$ARCHIVE" "$ARCHIVE.sha256"
